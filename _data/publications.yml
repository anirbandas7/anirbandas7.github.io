- id: unipre
  type: journal
  year: 2024
  title: "UniPreCIS: A data preprocessing solution for collocated services on shared IoT"
  authors: ["Anirban Das", "Navlika Singh", "Suchetana Chakraborty"]
  venue: "Future Generation Computer Systems"
  venue_short: "FGCS"
  volume: "153"
  pages: "543–557"
  doi: "10.1016/j.future.2023.11.029"
  url: "https://www.sciencedirect.com/science/article/abs/pii/S0167739X23004375"
  selected: true
  abstract: >-
    Next-generation smart city applications, attributed to the power of the Internet of Things (IoT)
    and Cyber–Physical Systems (CPS), significantly rely on sensing data quality. A shared sensing
    infrastructure that leverages low-cost sensing devices for a cost-effective solution remains
    unexplored territory. We propose UniPreCIS, a novel edge-based data preprocessing solution that
    accounts for the inherent characteristics of low-cost ambient sensors and their exhibited
    measurement dynamics concerning application-specific QoS. UniPreCIS identifies and selects
    quality data sources by performing sensor ranking and selection that dynamically adapts to the
    change in sensor attributes, and performs multimodal data preprocessing in a unified manner to
    meet heterogeneous application QoS while reducing the resource footprint at the network edge.
    On a real-world campus testbed, the processing time and memory utilization of the stakeholder
    services are reduced while achieving up to 90% accuracy.

- id: pmc24
  type: journal
  year: 2024
  title: "Passive Monitoring of Dangerous Driving Behaviors Using mmWave Radar"
  authors: ["Argha Sen", "Avijit Mandal", "Prasenjit Karmakar", "Anirban Das", "Sandip Chakraborty"]
  venue: "Pervasive and Mobile Computing"
  venue_short: "PMC"
  volume: "103"
  pages: "101949"
  doi: "10.1016/j.pmcj.2024.101949"
  url: "https://www.sciencedirect.com/science/article/abs/pii/S1574119224000750"
  selected: true
  abstract: >-
    Detecting risky driving has been a significant area of focus in recent years, yet a practical,
    effective and unobtrusive solution remains a complex challenge. We explore utilizing mmWave
    radars exclusively to identify dangerous driving behaviors. We scrutinize the attributes of
    unsafe driving and pinpoint distinct patterns in range-doppler readings brought about by nine
    common risky driving manoeuvres, and create a Fused-CNN model that identifies hazardous driving
    amidst regular driving and categorizes nine types of dangerous driving actions. Experiments with
    seven volunteers driving in real-world settings show an average precision of approximately 97%
    (±2%).

