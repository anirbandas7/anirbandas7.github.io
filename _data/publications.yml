# Publication list — the single source for the Publications page, the home page
# ("selected: true") and the CV.
#
# To add a paper, copy an entry and edit it. Fields:
#   type:        journal | conference | demo | preprint | patent
#   authors:     full names, in order ("Anirban Das" is bolded automatically)
#   venue:       full venue name;  venue_short: badge text, e.g. "IPSN 2024"
#   doi / url / pdf / arxiv / code: optional links (doi without https://doi.org/)
#   selected:    true to show on the home page
#   blurb:       one-line summary used on the home page "Recent work" cards
#   teaser:      figure for the "Recent work" card, e.g. /images/teasers/beatwave.svg
#                (16:9, an SVG or an image about 1200 px wide); teaser_alt describes it
#   topics:      optional research themes from _data/themes.yml (e.g. [mmwave, driving]);
#                leave out to file the paper by the keywords in _data/themes.yml;
#                they drive the theme cards on the home page and the topic filter
#   abstract:    optional, shown behind an "Abstract" toggle
# Entries are shown in the order they appear here within each section (newest first).

- id: beatwave
  type: conference
  topics: [ambient]
  year: 2026
  title: "BeatWave: Contactless Drum Generation from Ambient Wireless Sensing"
  authors: ["Srachet Rai", "Anirban Das"]
  venue: "18th International Conference on COMmunication Systems & NETworkS (COMSNETS)"
  venue_short: "COMSNETS 2026"
  pages: "201–209"
  doi: "10.1109/COMSNETS67989.2026.11418193"
  selected: true
  blurb: "Play drums in mid-air: hand motion disturbs the ambient wireless signals in a room, and a deep model turns those disturbances into drum beats."
  teaser: "/images/teasers/beatwave.svg"
  teaser_alt: "Illustration: a person drums in mid-air between a Wi-Fi router and a laptop; the signal disturbances become drum beats"
  abstract: >-
    BeatWave lets a person play drums in mid-air, without touching a surface, wearing a sensor or
    being filmed by a camera. Hand and body motion disturbs the ambient wireless signals already
    present in a room; BeatWave extracts temporal features from these disturbances and uses a deep-
    learning model to map them to rhythmic drum events. A technical evaluation and user studies
    indicate that the approach is feasible, robust and creatively engaging, pointing to more
    accessible, device-free musical interfaces.

- id: unipre
  type: journal
  topics: [iot]
  year: 2024
  title: "UniPreCIS: A data preprocessing solution for collocated services on shared IoT"
  authors: ["Anirban Das", "Navlika Singh", "Suchetana Chakraborty"]
  venue: "Future Generation Computer Systems"
  venue_short: "FGCS"
  volume: "153"
  pages: "543–557"
  doi: "10.1016/j.future.2023.11.029"
  url: "https://www.sciencedirect.com/science/article/abs/pii/S0167739X23004375"
  selected: true
  abstract: >-
    Next-generation smart city applications, attributed to the power of the Internet of Things (IoT)
    and Cyber–Physical Systems (CPS), significantly rely on sensing data quality. A shared sensing
    infrastructure that leverages low-cost sensing devices for a cost-effective solution remains
    unexplored territory. We propose UniPreCIS, a novel edge-based data preprocessing solution that
    accounts for the inherent characteristics of low-cost ambient sensors and their exhibited
    measurement dynamics concerning application-specific QoS. UniPreCIS identifies and selects
    quality data sources by performing sensor ranking and selection that dynamically adapts to the
    change in sensor attributes, and performs multimodal data preprocessing in a unified manner to
    meet heterogeneous application QoS while reducing the resource footprint at the network edge.
    On a real-world campus testbed, the processing time and memory utilization of the stakeholder
    services are reduced while achieving up to 90% accuracy.

- id: pmc24
  type: journal
  topics: [mmwave, driving]
  year: 2024
  title: "Passive Monitoring of Dangerous Driving Behaviors Using mmWave Radar"
  authors: ["Argha Sen", "Avijit Mandal", "Prasenjit Karmakar", "Anirban Das", "Sandip Chakraborty"]
  venue: "Pervasive and Mobile Computing"
  venue_short: "PMC"
  volume: "103"
  pages: "101949"
  doi: "10.1016/j.pmcj.2024.101949"
  url: "https://www.sciencedirect.com/science/article/abs/pii/S1574119224000750"
  selected: true
  blurb: "Nine kinds of dangerous driving recognised from in-cabin mmWave radar, at about 97% precision in real-world drives."
  teaser: "/images/teasers/driving.svg"
  teaser_alt: "Illustration: a dashboard mmWave radar watches the driver; range-Doppler patterns are classified into nine dangerous actions"
  abstract: >-
    Detecting risky driving has been a significant area of focus in recent years, yet a practical,
    effective and unobtrusive solution remains a complex challenge. We explore utilizing mmWave
    radars exclusively to identify dangerous driving behaviors. We scrutinize the attributes of
    unsafe driving and pinpoint distinct patterns in range-doppler readings brought about by nine
    common risky driving manoeuvres, and create a Fused-CNN model that identifies hazardous driving
    amidst regular driving and categorizes nine types of dangerous driving actions. Experiments with
    seven volunteers driving in real-world settings show an average precision of approximately 97%
    (±2%).

- id: ipsn24
  type: conference
  topics: [mmwave]
  year: 2024
  title: "Continuous Multi-user Activity Tracking via Room-Scale mmWave Sensing"
  authors: ["Argha Sen", "Anirban Das", "Swadhin Pradhan", "Sandip Chakraborty"]
  venue: "23rd ACM/IEEE International Conference on Information Processing in Sensor Networks (IPSN)"
  venue_short: "IPSN 2024"
  pages: "163–175"
  doi: "10.1109/IPSN61024.2024.00018"
  arxiv: "2309.11957"
  selected: true
  blurb: "One off-the-shelf mmWave radar tracks what several people in a room are doing, from walking to typing, with no cameras or wearables."
  teaser: "/images/teasers/mars.svg"
  teaser_alt: "Illustration: one mmWave radar in a room tracks five people and their activities over time"
  abstract: >-
    MARS continuously tracks what several people in a room are doing using a single commercial off-
    the-shelf mmWave radar, with no cameras, wearables or prior knowledge of the room. Its model
    recognises both macro-scale activities such as walking or squats and micro-scale activities such
    as typing or sitting, and a dynamic spatial time-sharing scheme lets the radar attend to
    multiple subjects at once. With five subjects performing 19 activities, MARS achieves a weighted
    F1-score above 94% with an average response time of about two seconds.

- id: acoudl
  type: conference
  topics: [ambient]
  year: 2024
  title: "AcouDL: Context-Aware Daily Activity Recognition from Natural Acoustic Signals"
  authors: ["Avijoy Chakma", "Anirban Das", "Abu Zaher Md Faridee", "Suchetana Chakraborty", "Sandip Chakraborty", "Nirmalya Roy"]
  venue: "IEEE International Conference on Smart Computing (SMARTCOMP)"
  venue_short: "SMARTCOMP 2024"
  pages: "332–337"
  doi: "10.1109/SMARTCOMP61445.2024.00077"
  selected: true
  blurb: "Household activities recognised from everyday sounds, using room-context features learned without labels to tell apart activities that sound alike."
  teaser: "/images/teasers/acoudl.svg"
  teaser_alt: "Illustration: kitchen sounds in a room become a mel spectrogram, combined with room context to recognise chopping, hammering and sharpening"
  abstract: >-
    AcouDL recognises daily household activities from natural audio captured by smart or wearable
    devices, targeting two practical hurdles: the cost of labelled data and activities that sound
    alike, such as chopping, hammering and knife sharpening. Because reverberation, surface
    materials and background noise leave a room-specific fingerprint in audio, AcouDL first learns
    room-context features with self-supervised contrastive learning on unlabelled recordings, then
    fuses them into the activity classifier through an attention mechanism. Across three datasets it
    improves macro F1 by 0.7 to 3.5 percentage points over baselines, with the largest gains in the
    hardest cases.

- id: mars-demo
  type: demo
  topics: [mmwave]
  year: 2024
  title: "Demo Abstract: MARS — An mmWave-based Multi-user Activity Tracking Solution"
  authors: ["Argha Sen", "Anirban Das", "Swadhin Pradhan", "Sandip Chakraborty"]
  venue: "23rd ACM/IEEE International Conference on Information Processing in Sensor Networks (IPSN)"
  venue_short: "IPSN 2024 Demo"
  pages: "269–270"
  doi: "10.1109/IPSN61024.2024.00035"
  abstract: >-
    This demo presents MARS, a room-scale system that uses one commercial mmWave radar to locate
    several people and recognise their activities continuously, covering both large movements such
    as walking and subtle ones such as typing. A dynamic spatial time-sharing approach spreads the
    radar's attention across subjects. In evaluation with five people and 19 activities, MARS
    identifies activities with over 93% accuracy and responds in about two seconds on average.

- id: mmhar-dataset
  type: preprint
  topics: [mmwave]
  year: 2024
  title: "A Dataset for Multi-intensity Continuous Human Activity Recognition through Passive Sensing"
  authors: ["Argha Sen", "Anirban Das", "Swadhin Pradhan", "Sandip Chakraborty"]
  venue: "arXiv preprint"
  venue_short: "arXiv"
  arxiv: "2407.21125"
  abstract: >-
    This paper releases mmDoppler, a dataset for passive human activity recognition with a
    commercial off-the-shelf mmWave radar. Seven subjects perform 19 activities that range from
    macro-scale exercise to micro-scale actions such as typing, recorded as range-Doppler heatmaps
    (with point clouds) in both single- and multi-subject settings. Doppler resolution is adapted to
    the activity so that subtle motions are captured, giving researchers a resource for building
    more robust and accurate mmWave activity recognition.

- id: mmdrive
  type: conference
  topics: [mmwave, driving]
  year: 2023
  title: "mmDrive: mmWave Sensing for Live Monitoring and On-Device Inference of Dangerous Driving"
  authors: ["Argha Sen", "Avijit Mandal", "Prasenjit Karmakar", "Anirban Das", "Sandip Chakraborty"]
  venue: "IEEE International Conference on Pervasive Computing and Communications (PerCom)"
  venue_short: "PerCom 2023"
  pages: "2–11"
  doi: "10.1109/PERCOM56429.2023.10099264"
  arxiv: "2301.08188"
  selected: true
  abstract: >-
    Detecting dangerous driving has been of critical interest for the past few years. However, a
    practical yet minimally intrusive solution remains challenging as existing technologies heavily
    rely on visual features or physical proximity. We explore the feasibility of purely using mmWave
    radars to detect dangerous driving behaviors. We study characteristics of dangerous driving and
    find unique patterns of range-doppler caused by 9 typical dangerous driving actions, then develop
    a Fused-CNN model to detect dangerous driving instances from regular driving and classify the 9
    actions. Extensive experiments with 5 volunteer drivers in real driving environments show an
    average accuracy above 95%.

- id: mmassist
  type: conference
  topics: [mmwave, driving]
  year: 2023
  title: "mmAssist: Passive Monitoring of Driver's Attentiveness Using mmWave Sensors"
  authors: ["Argha Sen", "Anirban Das", "Prasenjit Karmakar", "Sandip Chakraborty"]
  venue: "15th International Conference on COMmunication Systems & NETworkS (COMSNETS)"
  venue_short: "COMSNETS 2023"
  pages: "545–553"
  doi: "10.1109/COMSNETS56262.2023.10041297"
  abstract: >-
    Continuous monitoring of driver attentiveness inside a car has been of significant importance
    for quite some time, but state-of-the-art techniques are primarily image-based and therefore
    invasive. This work proposes continuous driver attentiveness monitoring leveraging millimeter
    Wave (mmWave) sensing. We study the driver's attention as a multi-class problem and address it
    using Range Doppler information from an mmWave radar. In a lab-based setup we achieve an
    accuracy of 88%, and in a real-world driving scenario up to 79%.

- id: cadgen
  type: journal
  topics: [iot]
  year: 2022
  title: "Where do all my smart home data go? Context-aware data generation and forwarding for edge-based microservices over shared IoT infrastructure"
  authors: ["Anirban Das", "Sandip Chakraborty", "Suchetana Chakraborty"]
  venue: "Future Generation Computer Systems"
  venue_short: "FGCS"
  volume: "134"
  pages: "204–218"
  doi: "10.1016/j.future.2022.03.027"
  url: "https://www.sciencedirect.com/science/article/abs/pii/S0167739X22001029"
  selected: true
  abstract: >-
    With the explosion of IoT devices and the edge computing paradigm, in-network data management is
    gaining research attention. The challenge lies in accommodating multiple application
    microservices with varying QoS requirements on a shared sensing infrastructure. We propose
    CaDGen (Context-aware Data Generation), a data collection framework that enables integrated data
    filtration and forwarding to minimize the resource footprint of the IoT infrastructure. The
    filtration uses contextual information of the running application to determine the relevance of
    data, while the forwarding policy selects suitable next-hop forwarders based on the distribution
    of microservices across edge devices. Testbed and simulation studies show nearly 35% reduction in
    generated data for a moderately dynamic scenario without compromising data quality.

- id: experience
  type: conference
  topics: [iot, ambient]
  year: 2022
  title: "Experience: Developing a Testbed for Ambient Sensing and in-Network Data Processing"
  authors: ["Anirban Das", "Suchetana Chakraborty"]
  venue: "14th International Conference on COMmunication Systems & NETworkS (COMSNETS)"
  venue_short: "COMSNETS 2022"
  pages: "691–699"
  doi: "10.1109/COMSNETS53615.2022.9668593"
  abstract: >-
    Multiple smart applications and services increasingly share a common sensing platform, and
    faster decision-making requires sensory data to be pre-processed at the network edge. Existing
    simulation platforms cannot account for the real-world dynamics affecting such edge-based
    sensing and data processing solutions. This work documents the practical lessons learnt while
    developing a testbed to evaluate edge-based solutions supporting ambient living, with the system
    architecture, requirement analysis, design and development arrangement, and a use-case
    demonstration of the challenges and potential solutions.

- id: syscon22
  type: conference
  topics: [ambient]
  year: 2022
  title: "Leveraging ambient sensing for the estimation of curiosity-driven human crowd"
  authors: ["Anirban Das", "Kartik Narayan", "Suchetana Chakraborty"]
  venue: "IEEE International Systems Conference (SysCon)"
  venue_short: "SysCon 2022"
  pages: "1–8"
  doi: "10.1109/SysCon53536.2022.9773844"
  abstract: >-
    We introduce an approach to measure the spatiotemporal significance of an object in terms of the
    curious crowd it attracts, using a set of passive sensors and wireless signal properties instead
    of cameras or smartphones. Validated on a room-scale testbed in a real-world scenario, the
    low-cost, privacy-friendly solution reaches beyond 90% accuracy.

- id: occupancy
  type: conference
  topics: [iot]
  year: 2020
  title: "A Study on Real-Time Edge Computed Occupancy Estimation in an Indoor Environment"
  authors: ["Anirban Das", "Rohan Gupta", "Suchetana Chakraborty"]
  venue: "12th International Conference on COMmunication Systems & NETworkS (COMSNETS)"
  venue_short: "COMSNETS 2020"
  pages: "527–530"
  doi: "10.1109/COMSNETS48256.2020.9027463"
  abstract: >-
    This work formulates human occupancy estimation in an indoor environment as a multi-class
    problem and proposes a low-cost, lightweight edge-based data management framework capable of
    real-time inference over multimodal streams from passive heterogeneous sensors, with testbed
    results.

- id: adaptive19
  type: conference
  topics: [iot]
  year: 2019
  title: "Significance of Adaptive Sensing for Smart Building Monitoring: A Practical Study"
  authors: ["Anirban Das", "Rohan Gupta", "Suchetana Chakraborty"]
  venue: "11th International Conference on Communication Systems & Networks (COMSNETS)"
  venue_short: "COMSNETS 2019"
  pages: "684–689"
  doi: "10.1109/COMSNETS.2019.8711469"
  abstract: >-
    Smart buildings generate large, heterogeneous and noisy sensor streams, and shipping all of it
    to a remote server for offline analysis is slow and costly for applications with differing
    quality-of-service needs. This work motivates context-adaptive sensing combined with in-network
    fusion of sensory data, so that inference happens faster and closer to the sensors. The idea is
    demonstrated on a campus-scale sensor network deployment that performs Kalman-filter-based in-
    network fusion and adapts sensing to context.

- id: fusion19
  type: conference
  topics: [iot]
  year: 2019
  title: "Motivating In-network Fusion for Smart Infrastructure Monitoring"
  authors: ["Anirban Das", "Rohan Gupta", "Suchetana Chakraborty"]
  venue: "11th International Conference on Communication Systems & Networks (COMSNETS)"
  venue_short: "COMSNETS 2019"
  pages: "513–516"
  doi: "10.1109/COMSNETS.2019.8711204"
  abstract: >-
    IoT deployments in smart buildings produce large volumes of heterogeneous data, and forwarding
    everything to a distant server wastes the resources of constrained sensor networks and degrades
    quality of service. This short paper studies context-adaptive sensing together with in-network
    data fusion, where nodes combine readings with a Kalman filter before forwarding. A planned
    smart-building testbed that incorporates contextual parameters is used to argue for the
    effectiveness of the approach.

- id: sdcf
  type: conference
  topics: [iot]
  year: 2018
  title: "SDCF: Sensory Data Collection Framework for Smart Building Application"
  authors: ["Anirban Das", "Suchetana Chakraborty"]
  venue: "IEEE SENSORS"
  venue_short: "IEEE SENSORS 2018"
  pages: "1–4"
  doi: "10.1109/ICSENS.2018.8589950"
  abstract: >-
    SDCF is a sensory data collection framework for smart building applications, where many
    heterogeneous sensors report continuously and the collection strategy directly affects
    application quality of service. It uses context-aware forwarding to improve delivery reliability
    and reduce delay, and combines adaptive forwarding with in-network data fusion to cut packet
    loss. Simulation results show more reliable delivery, lower delay and substantially lower packet
    loss than the AODV routing protocol.

- id: s3-18
  type: conference
  topics: [iot]
  year: 2018
  title: "Context Aware Data Collection Framework for Critical Infrastructure Monitoring System"
  authors: ["Anirban Das", "Suchetana Chakraborty"]
  venue: "10th Wireless of the Students, by the Students, and for the Students Workshop (S3), with ACM MobiCom"
  venue_short: "S3 2018"
  pages: "11–13"
  doi: "10.1145/3264877.3264881"
  abstract: >-
    Critical infrastructure monitoring relies on many connected sensors whose heterogeneous data
    must be collected efficiently, since the collection method strongly affects application
    performance. This work proposes a context-aware data collection framework that improves delivery
    reliability through context-aware forwarding and reduces collection cost by aggregating and
    fusing data inside the network only when needed. Simulations demonstrate the effectiveness of
    the approach.

- id: retis15
  type: conference
  year: 2015
  title: "Sentiment analysis using cosine similarity measure"
  authors: ["Saprativa Bhattacharjee", "Anirban Das", "Ujjwal Bhattacharya", "Swapan K. Parui", "Sudipta Roy"]
  venue: "IEEE 2nd International Conference on Recent Trends in Information Systems (ReTIS)"
  venue_short: "ReTIS 2015"
  pages: "27–32"
  doi: "10.1109/ReTIS.2015.7232847"
  abstract: >-
    This paper studies sentiment analysis of text using the cosine similarity measure, applying a
    vector-space similarity approach to determine the sentiment polarity of written content.

- id: icetacs13
  type: conference
  year: 2013
  title: "An empirical study of community and sub-community detection in social networks applying Newman-Girvan algorithm"
  authors: ["Deepjyoti Choudhury", "Saprativa Bhattacharjee", "Anirban Das"]
  venue: "1st International Conference on Emerging Trends and Applications in Computer Science (ICETACS)"
  venue_short: "ICETACS 2013"
  pages: "74–77"
  doi: "10.1109/ICETACS.2013.6691399"
  abstract: >-
    Community structure is a key property of social networks and is growing more complex on online
    platforms such as Facebook, Google+ and Twitter. This empirical study applies the Newman-Girvan
    algorithm, which repeatedly removes the highest-betweenness edges to split a network into
    groups, to real-world networks, and introduces an approach for detecting sub-communities within
    the communities it finds.

- id: patent-driver
  type: patent
  topics: [mmwave, driving]
  year: 2024
  title: "A System for In-Vehicle Passive Monitoring of Driver Behaviors"
  authors: ["Argha Sen", "Anirban Das", "Sandip Chakraborty"]
  venue: "Indian Patent (granted), Application No. 202431015618, filed"
  venue_short: "Patent"
  selected: true
  abstract: >-
    A system that passively monitors driver behaviour inside a vehicle using a small mmWave radar
    instead of a camera. It detects risky activities such as using a phone, drinking, yawning,
    nodding off, turning back and abnormal steering, addressing the privacy concerns that camera-
    based driver monitoring raises, especially in public and shared vehicles.

