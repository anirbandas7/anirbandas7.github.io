# Photos in the home-page strip. Only files listed here are shown, in file-name order.
# Files live in images/strip/. Keep to technical photos: hardware, deployments, demos.
# A photo that also appears in a published paper should cite it ("... From <authors>, <title>, <venue> (© publisher).").
# To hide a photo, delete its line or put # in front of it.
01-mars-demo-ipsn-2024.jpg: "The MARS mmWave demo at IPSN 2024, Hong Kong. From Sen, Das, Pradhan & Chakraborty, “Demo Abstract: MARS”, IPSN 2024 (© IEEE)."
03-beatwave-setup.jpg: "BeatWave: an ESP32 captures Wi-Fi CSI while a drummer plays, and the laptop records the signal. From Rai & Das, “BeatWave”, COMSNETS 2026 (© IEEE)."
04-crowd-sensing-setup.jpg: "Room setup for sensing curiosity-driven crowds: PIR, CO2, temperature and humidity nodes with a Wi-Fi sniffer. From Das, Narayan & Chakraborty, “Leveraging ambient sensing for the estimation of curiosity-driven human crowd”, IEEE SysCon 2022 (© IEEE)."
05-testbed-classroom.jpg: "Sensing nodes in a classroom (testbed, IIIT Guwahati). From Das & Chakraborty, “Experience: Developing a Testbed for Ambient Sensing and in-Network Data Processing”, COMSNETS 2022 (© IEEE)."
10-gas-sensor-array.jpg: "A low-cost gas-sensing prototype: ESP32 with MQ-series gas sensors and an LM35 temperature sensor"
11-csi-derived-audio.png: "Drum audio reconstructed from Wi-Fi CSI (work in progress)"

