# Research themes shown as cards on the home page.
# A paper belongs to a theme when its "topics" list in _data/publications.yml
# contains the theme's key. Cards show the number of papers and link to them
# on the Publications page (/publications/?topic=<key>).
# icon: radar | car | wave | nodes
- key: mmwave
  title: "mmWave radar sensing"
  icon: radar
  blurb: "Tracking people and their activities with millimetre-wave radar, from multi-user rooms to vehicle cabins."
- key: driving
  title: "Driver monitoring and road safety"
  icon: car
  blurb: "Passive, on-device monitoring of dangerous driving and driver attentiveness, now extending to on-road context on Indian roads."
- key: ambient
  title: "Ambient and acoustic sensing"
  icon: wave
  blurb: "Recognising daily activities, crowds and even drum beats from natural sounds and ambient wireless signals."
- key: iot
  title: "IoT data systems at the edge"
  icon: nodes
  blurb: "Context-aware data collection, in-network fusion and preprocessing for smart buildings and shared IoT infrastructure."
