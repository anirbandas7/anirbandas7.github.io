<div class="netmap{% if include.side %} netmap--side{% endif %}" data-me="{{ site.author.name }}">
  <div class="netmap__canvas">
    <svg class="netmap__svg" viewBox="{% if include.side %}0 0 440 540{% else %}0 0 900 560{% endif %}" role="img" aria-label="Co-author network graph"></svg>
  </div>
  <div class="netmap__panel" aria-live="polite">
    <p class="netmap__hint">Circle size shows the number of shared papers. Select a co-author to see them.</p>
  </div>
  <details class="netmap__listwrap">
    <summary>Co-authors as a list</summary>
    <ul class="netmap__list"></ul>
  </details>
  <script type="application/json" class="netmap__data">{{ site.data.publications | jsonify }}</script>
</div>
<script src="{{ '/assets/js/coauthor-map.js' | relative_url }}" defer></script>
